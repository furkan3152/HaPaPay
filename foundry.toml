[profile.default]
src = "contracts"
test = "foundry-test"
out = "foundry-out"
cache_path = "foundry-cache"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256
failure_persist_dir = "foundry-cache/fuzz"

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false
failure_persist_dir = "foundry-cache/invariant"
